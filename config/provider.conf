# config/provider.conf — where the REAL usage/cost and the spend gate come from.
#
# The engine only needs three provider-specific things: the per-run session transcripts that carry the
# provider-reported cost (usage.costUsd), a command that turns them into a number, and the spend gate.
# They live here so moving off Command Code is an edit to THIS file (plus the model list in .env),
# not a change to the launcher. Every value has a matching default in the scripts, so deleting this
# file — or any single line — keeps the current behaviour.
#
# Sourced by tools/cron-run.sh and tools/run-stats.sh AFTER $ROOT is set.

# Label only — surfaced in logs.
PROVIDER_NAME=commandcode

# Directory holding the CLI's per-project session transcripts (the real costUsd is inside them).
# The scripts append the project slug (the workspace path, lowercased, non-alphanumerics -> '-').
USAGE_PROJECTS_DIR=$HOME/.commandcode/projects

# Turns session transcripts into one line:
#   <cmd> --brief --files <t.jsonl>...   ->   "<cents>|<turns>|<inputTokens>|<usd>"
USAGE_STATS_CMD=$ROOT/tools/run-stats.sh

# Spend gate: "<cmd> --gate" exits 0 when paid spend is allowed; "<cmd> --json" prints the windows.
QUOTA_CMD=$ROOT/tools/cc-quota

# --- model order (per run) ---------------------------------------------------
# Free models come and go, so instead of a fixed list the launcher asks a picker for TODAY's order:
#   <working free model>,<other free>,<cheap paid>,<final fallback>
# MODELS_PICK_CMD prints that comma-separated line (empty output -> fall back to APPLY_MODELS in .env).
# The default discovers the live free model (cmd --list-models + a 1-turn probe). For another
# provider, point this at your own picker, or set it empty to use APPLY_MODELS verbatim.
MODELS_PICK_CMD="$ROOT/tools/cc-models.sh --pick"
# Secondary model: a good but cheaper PAID model (tried after the free one fails, same run).
APPLY_CHEAP_PAID=${APPLY_CHEAP_PAID:-z-ai/glm-5.3-flash}
# Final fallback: deepseek latest (last model tried in the run).
APPLY_FINAL_MODEL=${APPLY_FINAL_MODEL:-deepseek/deepseek-v4-flash}
# Probe free candidates live before committing the run to one (1 = on, 0 = trust the catalogue).
APPLY_PICK_PROBE=${APPLY_PICK_PROBE:-1}
APPLY_PICK_PROBE_MAX=${APPLY_PICK_PROBE_MAX:-4}
