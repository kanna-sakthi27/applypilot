# config/scope.conf — deterministic pre-filter rules. Read by tools/prefilter.py.
#
# Everything here runs in pure Python BEFORE any model tokens are spent, and its verdict is
# authoritative: it overwrites whatever the scan phase guessed. Edit freely — no code change is
# needed to add a rule.
#
# Syntax
#   [section]
#   pattern: <regex>                 # case-insensitive
#   pattern: <regex> => <reason>     # optional explicit reason label
#   key = value                      # scalars, only in [settings]-style sections
#
# Sections
#   [title_in]        a title matching ANY pattern is in scope
#   [title_out]       a title matching ANY pattern is OUT of scope — checked first and wins
#   [wall]            hard walls found in the posting text -> gate=fail
#   [language]        a required language the candidate does not hold -> gate=fail
#   [contract]        contract shapes that are always skipped -> gate=fail
#   [floors]          per-currency monthly apply-floor (below -> gate=fail)
#   [fx]              currency -> USD rate, used to normalise a posted salary
#   [settings]        min_confidence, default currency, hours/day assumptions

[title_in]
pattern: \bdevops\b => devops title
pattern: \bdev ops\b => devops title
pattern: \bsre\b => sre title
pattern: \bsite reliability\b => sre title
pattern: \bplatform (engineer|lead|manager|architect|operations)\b => platform title
pattern: \bcloud (engineer|architect|lead|manager|operations|infrastructure)\b => cloud title
pattern: \binfrastructure (engineer|lead|manager|architect|operations|specialist)\b => infra title
pattern: \b(infra|systems?) (engineer|administrator|admin|lead|manager)\b => systems title
pattern: \blinux (engineer|administrator|admin|lead|systems)\b => linux title
pattern: \bdevsecops\b => devsecops title
pattern: \brelease engineer\b => release title
pattern: \bhead of (devops|cloud|infrastructure|platform|sre)\b => head-of title
pattern: \bengineering manager\b => engineering manager
pattern: \btechnical manager\b => technical manager

[title_out]
pattern: \b(help ?desk|service desk|desktop support|it support|technical support|1st line|2nd line)\b => helpdesk
pattern: \b(qa|quality assurance|test (engineer|analyst)|sdet)\b => pure QA
pattern: \b(data (engineer|scientist|analyst)|machine learning|mlops|ai engineer|deep learning)\b => data/ML
pattern: \b(recruiter|talent acquisition|sales|account executive|business development)\b => non-technical
pattern: \b(network (engineer|administrator)|nocc? engineer)\b => pure networking
pattern: \b(dba|database administrator)\b => pure DBA
pattern: \b(frontend|front-end|backend|back-end|full ?stack|mobile|android|ios) (developer|engineer)\b => application dev
pattern: \b(graduate|intern|internship|trainee|apprentice)\b => junior/intern
pattern: \b(oracle|sap|workday (hcm|financials)|successfactors|dynamics 365|microsoft 365|sharepoint|intune)\b => enterprise-apps / workplace
pattern: \b(project manager|programme manager|scrum master|product manager)\b => non-technical management
pattern: \bsolution architect\b => non-infra solution architect

[wall]
pattern: \b(must be|only) (a )?(us|u\.s\.|united states) (citizen|national)\b => citizenship-only (US)
pattern: \bmust (be|hold) (a )?(canadian|uk|australian|irish) (citizen|citizenship|pr|permanent resident)\b => citizenship-only
pattern: \b(no|unable to (offer|provide)) (visa )?sponsorship\b => no sponsorship
pattern: \bwithout (the need for )?sponsorship\b => no sponsorship
pattern: \b(must|need to) (already )?(be )?(authoris|authoriz)ed to work\b => right-to-work required
pattern: (^|\W)sc (clearance|cleared)|security clearance|dv clearance|5 years? (of )?uk residency|settled status => UK clearance/residency
pattern: \bstate of (residence|residency)\b|\bus (state|residents?) only\b => US state residency gate

[language]
pattern: \b(fluent|native|proficient|c1|c2|b2|business[- ]level|very good)\b[^.]{0,40}\b(german|deutsch)\b => German required
pattern: \b(fluent|native|proficient|c1|c2|b2|business[- ]level|very good)\b[^.]{0,40}\b(french|fran[cç]ais)\b => French required
pattern: \b(fluent|native|proficient|c1|c2|b2|business[- ]level|very good)\b[^.]{0,40}\bdutch\b => Dutch required
pattern: \b(fluent|native|proficient|c1|c2|b2|business[- ]level)\b[^.]{0,40}\b(finnish|swedish|danish|norwegian)\b => Nordic language required
pattern: \b(fluent|native|proficient)\b[^.]{0,40}\b(spanish|italian|portuguese|mandarin|cantonese|japanese|korean|arabic)\b => other language required
pattern: \b(german|deutsch|french|fran[cç]ais|dutch)\b (is )?(required|mandatory|essential) => language required

[contract]
pattern: \b(per hour|/ ?hr|hourly|per ?hour rate)\b => hourly rate
pattern: \b\d+ ?(usd|eur|gbp|myr|cad|aud|sgd|aed)[^.]{0,12}(/|per ) ?(hr|hour)\b => hourly rate
pattern: \bday ?rate|per day|/ ?day\b => day rate
pattern: \bfixed[- ]term\b[^.]{0,20}\b([1-9]|1[01]) ?months?\b => contract under 12 months
# 12 months and above is fine; this only catches 1-11 months.
pattern: \b(?!1[2-9]|[2-9]\d)(\d{1,2}) ?months? (contract|fixed[- ]term|engagement)\b => contract under 12 months

# Monthly apply-floor per currency. A posted band whose top is below this is gate=fail.
[floors]
USD = 7000
GBP = 5200
EUR = 6000
SGD = 8900
CAD = 9700
AUD = 9700
AED = 25700
SAR = 26250
QAR = 25500
INR = 660000
MYR = 28300
HKD = 54900
NZD = 11900
CHF = 5700
RON = 31800
JPY = 1050000

# Approximate monthly-average FX to USD, used only to compare against the USD floor.
[fx]
USD = 1.0
GBP = 1.27
EUR = 1.08
SGD = 0.74
CAD = 0.73
AUD = 0.66
AED = 0.27
SAR = 0.27
QAR = 0.27
INR = 0.012
MYR = 0.22
HKD = 0.128
NZD = 0.60
CHF = 1.11
