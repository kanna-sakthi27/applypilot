# config/tab-cleanup.conf — which leftover tabs the sweep is allowed to close.
#
# A run opens tabs in YOUR browser. The prompt asks the agent to close each one as it finishes, but
# a run that is cut off, times out or is killed never gets the chance — so the engine sweeps up
# afterwards. There are TWO lists, with different safety rules:
#
#   [hosts]    Closed ONLY if the tab did NOT exist before the run started AND its host matches.
#              Use this for job BOARDS (LinkedIn, Indeed, Workopolis, Jaabz, …): the candidate keeps those
#              open herself, so a tab that was already there must never be touched.
#
#   [reclaim]  Closed EVEN IF the tab was already open. Use this for company ATS / apply pages,
#              which the candidate never parks as a destination. Without this an already-leaked apply tab
#              enters every future "before" snapshot and lives forever — the exact accumulation
#              seen on 2026-10-12.
#
# Anything else — your email, your music, a tab you opened yourself — is never touched.

[settings]
# Max tabs closed per pass. Runs can open 20+ job tabs (jaabz especially), so this must be well
# above a normal run: at 12 the leftover tabs were re-snapshotted and became permanent (2026-10-12).
# The [hosts]/[reclaim] rules are the real safety, not this number.
max_close = 60
# Print what would be closed without closing it (useful when tuning the host list).
dry_run = no

[hosts]
# Job boards — never closed if they were already open (the candidate keeps these herself).
host: linkedin.com
host: indeed.com
host: smartapply.indeed.com
host: ch.indeed.com
host: glassdoor.com
host: glassdoor.co.uk
host: jaabz.com
host: workopolis.com
host: jobs.ch
host: ziprecruiter.com
host: monster.com
host: dice.com
# Identity providers the sign-in flows bounce through (transient; only ever opened mid-apply).
host: accounts.google.com

[reclaim]
# Company ATS platforms. the candidate does not park an application form, so a leftover here is always the
# automation's — safe to close even if it predates the run.
host: myworkdayjobs.com
host: workday.com
host: greenhouse.io
host: lever.co
host: icims.com
host: ashbyhq.com
host: taleo.net
host: smartrecruiters.com
host: workable.com
host: bamboohr.com
host: recruitee.com
host: applytojob.com
host: successfactors.com
host: sapsf.com
host: sapsf.eu
host: jazz.co
host: jobvite.com
host: breezy.hr
host: paylocity.com
host: oraclecloud.com
host: icims.eu
# External company careers pages this engine has actually opened (add more as they appear).
